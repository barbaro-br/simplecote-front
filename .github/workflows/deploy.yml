name: CI e Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'openspec/**'
      - 'docs/**'
      - '**/*.md'
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run
      - run: npx oxlint

  deploy:
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-front-${{ github.ref }}
      cancel-in-progress: true
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Checar secrets da Vercel
        run: |
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!v}" ]; then echo "::error::secret $v vazio ou ausente no repositório"; exit 1; fi
          done
      - run: npm i -g vercel@latest
      - run: vercel pull --yes --environment=production
      # A base da API entra no bundle em build time (api-client: import.meta.env.VITE_API_BASE_URL).
      # Fixada aqui, e não como env var de Production na Vercel, porque a URL do Heroku é pública
      # (está no README) e assim o deploy não depende de config no painel. Sem isto, a base vira ''
      # e o front chama /api/** no próprio domínio da Vercel -> 405 no POST /api/auth/login.
      - run: vercel build --prod
        env:
          VITE_API_BASE_URL: https://immense-badlands-31311-934249812234.herokuapp.com
      - run: vercel deploy --prebuilt --prod
