name: CI e Deploy

on:
  push:
    # `redesign/painel-dark` é a implantação de transição em novo.simplecote.app
    # (job `deploy-novo`); `main` é a produção deste app em *.simplecote.app
    # (job `deploy`) — `simplecote.app` (apex) é outro projeto (site institucional).
    branches: [main, redesign/painel-dark]
    paths-ignore:
      - 'openspec/**'
      - 'docs/**'
      - '**/*.md'
  pull_request:

# Base da API embutida no bundle em build time (api-client: import.meta.env.VITE_API_BASE_URL).
# Fixada aqui, e não como env var de Production na Vercel, porque a URL é pública e assim o
# deploy não depende de config no painel. Sem isto a base vira '' e o front chama /api/** no
# próprio domínio da Vercel -> 405 no POST /api/auth/login; o guard em vite.config.ts falha o
# build de produção nesse caso. Nível de workflow: o `ci` (que roda `npm run build`) e o
# `deploy` (build + smoke) precisam da mesma var.
# Domínio custom: api.simplecote.app (CNAME -> Heroku app immense-badlands-31311).
# Mesmo site (eTLD+1) do app (*.simplecote.app): o cookie de refresh (httpOnly,
# Domain=.simplecote.app) fica first-party, sem depender de bloqueio de cookie
# de terceiros do navegador — antes a API respondia em api.simplecote.com.br
# (site diferente do app) e o refresh falhava silenciosamente em qualquer
# navegação de página inteira, jogando o usuário de volta pro /login.
env:
  VITE_API_BASE_URL: https://api.simplecote.app

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run
      - run: npx oxlint

  deploy:
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-front-${{ github.ref }}
      cancel-in-progress: true
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # Sentry (observabilidade de erros) — só no build do deploy, NÃO no job `ci`:
      # o `iniciarSentry()` lê `VITE_SENTRY_DSN` em runtime e os testes verificam o
      # caminho "sem DSN", que quebraria se a var vazasse pro `npx vitest run`.
      # Sem DSN o `iniciarSentry()` é no-op (nenhuma chamada a serviço externo).
      # `release` = SHA do commit para casar o erro com o build exato.
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      VITE_SENTRY_RELEASE: ${{ github.sha }}
      # Upload de sourcemaps no `vercel build --prod` (@sentry/vite-plugin):
      # sem o token o plugin é pulado e o stacktrace de produção fica minificado.
      # `release` = `VITE_SENTRY_RELEASE` (mesmo SHA) para casar mapa e evento.
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: francisco-montalvao
      SENTRY_PROJECT: simple-cote-front
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Checar secrets da Vercel
        run: |
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!v}" ]; then echo "::error::secret $v vazio ou ausente no repositório"; exit 1; fi
          done
      - run: npm i -g vercel@latest
      - run: vercel pull --yes --environment=production
      - run: vercel build --prod
      - run: vercel deploy --prebuilt --prod
      # Smoke pós-deploy: o "ci verde" só garante que compila + testes mockados passam.
      # Este step valida o artefato REAL publicado — o bundle no ar precisa conter a URL
      # do back, e o back precisa responder. Se falhar, o deploy já foi (rode `vercel
      # rollback`), mas a pipeline fica vermelha e você sabe na hora, não pelo cliente.
      - name: Smoke — bundle publicado fala com o back
        run: |
          # `simplecote.app` (apex) virou o site institucional (projeto Vercel
          # separado, `simplecote-institucional`) — não usar aqui. O domínio de
          # produção deste projeto (`simplecote-front`) é o curinga
          # `*.simplecote.app`; `app.simplecote.app` é a instância canônica
          # sem loja específica, sem redirect (vercel.json não tem mais
          # `redirects` desde a correção do login pós-reapontamento de domínio).
          alias_url="https://app.simplecote.app"
          host="${VITE_API_BASE_URL#https://}"
          ok=""
          for i in 1 2 3 4 5; do
            html=$(curl -fsS "$alias_url/" || true)
            # Com o code-splitting por rota, a URL do back pode cair em qualquer
            # chunk referenciado no HTML (hoje em utils-*.js, não mais em index-*.js).
            # Por isso varre todos os /assets/*.js em vez de fixar o prefixo index-.
            bundles=$(printf '%s' "$html" | grep -oE '/assets/[A-Za-z0-9_-]+\.js' | sort -u || true)
            for bundle in $bundles; do
              js=$(curl -fsS "$alias_url$bundle" || true)
              case "$js" in *"$host"*) ok=1; break ;; esac
            done
            [ -n "$ok" ] && break
            echo "tentativa $i: bundle ainda não propagou, aguardando…"
            sleep 6
          done
          if [ -z "$ok" ]; then
            echo "::error::nenhum bundle publicado contém $host — VITE_API_BASE_URL não entrou no build"
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' "$VITE_API_BASE_URL/actuator/health")
          if [ "$code" != "200" ]; then
            echo "::error::back não respondeu 200 em $VITE_API_BASE_URL/actuator/health (got $code)"
            exit 1
          fi
          echo "smoke ok — bundle chama $host, back /actuator/health 200"

  # Implantação de transição do redesign: push em `redesign/painel-dark` publica
  # novo.simplecote.app (projeto Vercel `simplecote-front-novo`). Espelha o job
  # `deploy`, trocando só o projeto de destino. Reaproveita VERCEL_ORG_ID/TOKEN
  # (o project id não é segredo — fixado abaixo).
  deploy-novo:
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/redesign/painel-dark'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-front-novo
      cancel-in-progress: true
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: prj_NuP2d37VesrqJVpAWjUJewpK2WLq
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      VITE_SENTRY_RELEASE: ${{ github.sha }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: francisco-montalvao
      SENTRY_PROJECT: simple-cote-front
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Checar secrets da Vercel
        run: |
          for v in VERCEL_TOKEN VERCEL_ORG_ID; do
            if [ -z "${!v}" ]; then echo "::error::secret $v vazio ou ausente no repositório"; exit 1; fi
          done
      - run: npm i -g vercel@latest
      - run: vercel pull --yes --environment=production
      - run: vercel build --prod
      - run: vercel deploy --prebuilt --prod
      - name: Smoke — novo.simplecote.app no ar
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://novo.simplecote.app/)
            [ "$code" = "200" ] && { echo "smoke ok — novo.simplecote.app 200"; exit 0; }
            echo "tentativa $i: novo.simplecote.app respondeu $code, aguardando…"
            sleep 6
          done
          echo "::error::novo.simplecote.app não respondeu 200"
          exit 1
